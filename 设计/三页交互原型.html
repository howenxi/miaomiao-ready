<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>喵喵就位 · 界面原型</title>
<style>
:root{--paper:#fff;--ground:#f1eef6;--ink:#292439;--muted:#665d74;--berry:#65418a;--tint:#f1e8fa;--line:#e6dfed}
*{box-sizing:border-box}body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.55 "Microsoft YaHei","PingFang SC",sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #9866c2;outline-offset:3px}button:disabled{cursor:default;opacity:.48}
.demo{width:min(850px,calc(100% - 32px));margin:32px auto 48px}.nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.nav span{color:var(--muted);margin-right:auto}.nav button,.plain{border:0;background:transparent;color:var(--muted);padding:8px 12px;border-radius:8px}.nav button[aria-current=true]{background:white;color:var(--berry);font-weight:700}
.window{background:white;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 16px 48px #33224b12}.brand{display:flex;align-items:center;gap:10px;padding:11px 28px;border-bottom:1px solid var(--line);height:64px}.brand img{width:38px;height:38px;object-fit:contain}.brand strong{font-size:18px}.brand small{margin-left:auto;color:var(--muted);font-size:13px}main{padding:30px 36px 0;min-height:510px}h1{font-size:clamp(24px,5vw,32px);line-height:1.25;margin:0 0 8px;letter-spacing:-.03em}p{margin:0;color:var(--muted)}.cats{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 18px}.cat{display:flex;align-items:center;gap:8px;min-height:52px;padding:6px 14px;background:white;border:1px solid var(--line);border-radius:12px;color:var(--ink);font-weight:700}.cat[aria-pressed=true]{background:var(--tint);border-color:var(--berry);color:var(--berry)}
.art{width:36px;height:36px;object-fit:contain;flex:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;border-top:1px solid var(--line)}.row{display:flex;align-items:center;gap:11px;min-height:59px;width:100%;padding:8px 4px;border:0;border-bottom:1px solid var(--line);background:white;text-align:left;color:var(--ink)}button.row:hover{background:#faf6fd}.row strong{font-size:14px}.tag{margin-left:auto;white-space:nowrap;font-size:12px;color:var(--muted);background:#f4f1f6;border-radius:6px;padding:3px 7px}.tag.on{color:var(--berry);background:var(--tint)}
footer{display:flex;align-items:center;gap:10px;padding:18px 0 22px;margin-top:13px;flex-wrap:wrap}.push{margin-left:auto}.cta,.secondary{min-height:42px;border-radius:9px;padding:8px 16px;font-weight:700}.cta{background:var(--berry);border:1px solid var(--berry);color:white}.secondary{background:white;border:1px solid var(--line);color:var(--ink)}.status{color:var(--muted);font-size:13px}.stage{min-height:350px;display:grid;align-content:center;gap:18px;padding:24px 8px}.track{height:8px;background:var(--tint);border-radius:99px;position:relative;margin:46px 44px 0}.fill{height:100%;width:var(--progress);background:var(--berry);border-radius:99px}.runner{position:absolute;width:94px;height:78px;object-fit:contain;left:var(--progress);bottom:4px;transform:translateX(-50%)}.progressText{display:flex;justify-content:space-between;margin:0 44px;color:var(--muted);font-variant-numeric:tabular-nums}.sizes{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:22px 0 16px}.sizes button[aria-pressed=true]{background:var(--tint);color:var(--berry);border-color:var(--berry)}.trial{min-height:65px}.trial small{display:block;color:var(--muted)}.trial input{width:100%;max-width:200px;border:1px solid var(--line);border-radius:6px;padding:3px 7px;margin-top:3px}.trial button{padding:0;background:transparent;border:0;color:var(--berry);text-decoration:underline}
@media(max-width:600px){.demo{margin-top:12px}.brand{padding-inline:16px}main{padding:22px 16px 0}.grid{grid-template-columns:1fr}.track,.progressText{margin-inline:28px}.nav span{width:100%}}
.art-frame{width:36px;height:36px;position:relative;overflow:hidden;flex:none}.art-frame .art{position:absolute;max-width:none;object-fit:fill}.brand-close{margin-left:auto;width:38px;height:38px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink);font-size:24px;line-height:1}.brand-close:hover{background:var(--tint)}
.assignment-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 10px}.assignment-hint{margin:0;color:var(--muted);font-size:13px}.whole-cat{padding:6px 12px;min-height:34px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--berry);font-size:13px;font-weight:700;white-space:nowrap}.whole-cat:hover:not(:disabled){background:var(--tint);border-color:var(--berry)}.whole-cat:disabled{opacity:1;color:var(--muted);background:#f7f5f9;font-weight:400}.cats{margin:0 0 14px}.pick-screen{min-height:0}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}

/* Quiet selection and action hierarchy: background and checkmark replace repeated outlines. */
.cat{position:relative;border:0;background:transparent;padding:9px 16px;min-height:56px;border-radius:14px;transition:background .15s ease,color .15s ease}
.cat:hover{background:#f5f3f8}
.cat[aria-pressed=true]{background:var(--tint);color:var(--berry)}
.cat[aria-pressed=true]::after{content:'✓';position:absolute;right:5px;top:3px;font-size:10px;line-height:14px;font-weight:700;color:var(--berry)}
.cat:active{background:#e9dff2}
.whole-cat{border:0;background:#f2f0f5;color:var(--berry);padding:7px 13px;min-height:34px;border-radius:9px;transition:background .15s ease}
.whole-cat:hover:not(:disabled){background:#e9e2f1}
.whole-cat:active:not(:disabled){background:#e1d7ec}
.whole-cat:disabled{background:#f6f5f8;color:#807789;opacity:1;font-weight:400}
.tag,.tag.on{background:transparent;color:var(--muted);padding:3px 0;border-radius:0;font-size:12px;font-weight:400}
.row{transition:background .15s ease}
button.row:hover{background:#f7f4fa}
button.row:active{background:var(--tint)}
@media(prefers-reduced-motion:reduce){.cat,.whole-cat,.row{transition:none}}

/* Shared quiet controls for loading and completion pages. */
.brand-close{border:0;background:transparent;color:var(--muted);border-radius:10px;transition:background .15s ease,color .15s ease}
.brand-close:hover{background:#f2f0f5;color:var(--ink)}
.sizes{gap:6px;margin:22px 0 18px}
.sizes>strong{font-size:14px;margin-right:8px}
.sizes .secondary{border:0;background:#f2f0f5;color:var(--muted);min-height:36px;padding:7px 14px;border-radius:9px;font-size:14px;transition:background .15s ease,color .15s ease}
.sizes .secondary:hover:not(:disabled){background:#e9e2f1;color:var(--berry)}
.sizes button[aria-pressed=true]{background:var(--tint);color:var(--berry)}
.sizes #sizeApply{margin-left:8px;color:var(--berry)}
.sizes #sizeApply:disabled{opacity:1;background:#f6f5f8;color:#807789}
.sizes .status{margin-left:7px;font-size:12px}
.trial input{background:#f5f3f7;border:1px solid transparent;border-radius:8px;padding:6px 9px;color:var(--ink);font-size:13px;transition:background .15s ease,border-color .15s ease}
.trial input::placeholder{color:#807789}
.trial input:hover{background:#eeebf2}
.trial input:focus{background:white;border-color:var(--berry);outline:2px solid #65418a20;outline-offset:1px}
.trial button{font-size:13px;text-underline-offset:3px}
.trial small{font-size:12px}
.trial{min-height:70px}
#restore{font-size:14px;border-radius:9px;padding:8px 12px}
#restore:hover{background:#f2f0f5;color:var(--ink)}
.cta{border:0;border-radius:10px;transition:background .15s ease,transform .15s ease}
.cta:hover:not(:disabled){background:#563578}
.cta:active:not(:disabled){transform:translateY(1px)}
.track{height:7px;background:#eeebf3}
.fill{background:var(--berry);transition:width .2s linear}
.runner{transition:left .2s linear}
.progressText{font-size:13px}
.progressText strong{color:var(--berry);font-weight:600}
@media(prefers-reduced-motion:reduce){.brand-close,.sizes .secondary,.trial input,.cta,.fill,.runner{transition:none}}

/* One decision page, one application, then a focused trial page. */
.pick-footer{justify-content:space-between;gap:20px;margin-top:14px;padding-top:16px}
.size-setting{display:flex;align-items:center;gap:14px}
.size-caption{font-size:13px;color:var(--muted);white-space:nowrap}
.size-segments{display:flex;gap:3px;padding:3px;background:#f1eff4;border-radius:10px}
.size-segments button{border:0;background:transparent;color:var(--muted);min-width:44px;min-height:32px;padding:5px 12px;border-radius:7px;font-size:13px}
.size-segments button:hover{color:var(--ink);background:#e9e5ef}
.size-segments button[aria-pressed=true]{background:white;color:var(--berry);font-weight:700;box-shadow:0 1px 4px #29243912}
.pick-screen .row{min-height:65px}
.assignment-bar{margin-bottom:8px}
.done-screen{min-height:0}.done-screen h1{font-size:26px}.done-intro{font-size:14px;margin-top:8px;margin-bottom:24px}
.trial-grid .row{min-height:78px}.trial-grid .art-frame{margin-right:2px}
.load-screen{min-height:440px}.stage{min-height:320px}.load-screen h1{font-size:26px}
#back{padding-left:0;font-size:14px}#back:hover{color:var(--berry)}
@media(max-width:440px){.pick-footer{gap:14px}.size-setting{gap:8px}.size-segments button{min-width:35px;padding:5px 8px}.pick-footer .cta{padding:8px 12px}.done-screen footer{gap:6px}.done-screen footer .plain{font-size:13px;padding-inline:7px}}
</style>
<div class="demo">
<nav class="nav" aria-label="原型页面"><span>交互原型 · 不修改系统指针</span><button data-page="pick">选猫页</button><button data-page="load">加载页</button><button data-page="done">完成页</button></nav>
<div class="window"><header class="brand"><img src="../素材/银白猫-品牌坐姿.png" alt=""><strong>喵喵就位</strong><small id="step"></small><button class="brand-close" id="windowClose" type="button" aria-label="关闭窗口" hidden>×</button></header><main id="screen"></main></div>
</div>
<script>
const names=['正常选择','文字输入','链接点击','不可用','忙碌中','移动画布','左右调整','上下调整'];
const variants=['calico-normal','silver-text','silver-link','silver-no','silver-busy','calico-move','calico-horizontal','calico-vertical'];
const cats=['银渐层','三花','狸花猫','德文'], defaults=[0,0,0,0,0,0,0,0];
const descriptions=['移动鼠标试试','输入几个字','点一下链接','此操作暂不可用','查看等待指针','在区域内移动','左右移动鼠标','上下移动鼠标'];
let choices=[...defaults],cat=0,selected=35,applied=35,timer,page='pick',assignmentNotice='',appliedChoices=[...defaults],hasApplied=false;
const screen=document.querySelector('#screen'),step=document.querySelector('#step');
const asset=(i,c)=>["银渐层设计方案", "三花设计方案", "狸花猫设计方案-优化版", "德文设计方案-优化版"][c]+'/'+names[i]+'.png';
const artBounds={"银渐层设计方案/正常选择.png": [560, 560, 32, 24, 527, 536], "银渐层设计方案/文字输入.png": [560, 560, 39, 24, 521, 536], "银渐层设计方案/链接点击.png": [560, 560, 67, 24, 493, 536], "银渐层设计方案/不可用.png": [560, 560, 33, 24, 527, 536], "银渐层设计方案/忙碌中.png": [560, 560, 24, 27, 536, 533], "银渐层设计方案/移动画布.png": [560, 560, 24, 62, 536, 497], "银渐层设计方案/左右调整.png": [560, 560, 24, 93, 536, 467], "银渐层设计方案/上下调整.png": [560, 560, 29, 24, 530, 536], "三花设计方案/正常选择.png": [560, 560, 50, 24, 510, 536], "三花设计方案/文字输入.png": [560, 560, 71, 24, 488, 536], "三花设计方案/链接点击.png": [560, 560, 30, 24, 529, 536], "三花设计方案/不可用.png": [560, 560, 68, 24, 491, 536], "三花设计方案/忙碌中.png": [560, 560, 24, 51, 536, 509], "三花设计方案/移动画布.png": [560, 560, 24, 107, 536, 452], "三花设计方案/左右调整.png": [560, 560, 24, 110, 536, 450], "三花设计方案/上下调整.png": [560, 560, 69, 24, 490, 536], "狸花猫设计方案-优化版/正常选择.png": [560, 560, 60, 24, 499, 536], "狸花猫设计方案-优化版/文字输入.png": [560, 560, 24, 72, 536, 488], "狸花猫设计方案-优化版/链接点击.png": [560, 560, 59, 24, 500, 536], "狸花猫设计方案-优化版/不可用.png": [560, 560, 90, 24, 469, 536], "狸花猫设计方案-优化版/忙碌中.png": [560, 560, 24, 42, 536, 517], "狸花猫设计方案-优化版/移动画布.png": [560, 560, 40, 24, 519, 536], "狸花猫设计方案-优化版/左右调整.png": [560, 560, 24, 50, 536, 510], "狸花猫设计方案-优化版/上下调整.png": [560, 560, 78, 24, 481, 536], "德文设计方案-优化版/正常选择.png": [560, 560, 71, 24, 489, 536], "德文设计方案-优化版/文字输入.png": [560, 560, 25, 24, 534, 536], "德文设计方案-优化版/链接点击.png": [560, 560, 77, 24, 483, 536], "德文设计方案-优化版/不可用.png": [560, 560, 98, 24, 461, 536], "德文设计方案-优化版/忙碌中.png": [560, 560, 24, 54, 536, 505], "德文设计方案-优化版/移动画布.png": [560, 560, 26, 24, 533, 536], "德文设计方案-优化版/左右调整.png": [560, 560, 24, 104, 536, 455], "德文设计方案-优化版/上下调整.png": [560, 560, 72, 24, 488, 536]};
const art=(i,c,pixels=34,frame=36)=>{
 const src=asset(i,c),[w,h,l,t,r,b]=artBounds[src],scale=pixels/Math.max(r-l,b-t);
 return '<span class="art-frame" style="width:'+frame+'px;height:'+frame+'px"><img class="art" src="'+src+'" alt="" style="width:'+w*scale+'px;height:'+h*scale+'px;left:'+(frame/2-(l+r)*scale/2)+'px;top:'+(frame/2-(t+b)*scale/2)+'px"></span>';
};
const panel=document.querySelector('.window'), windowClose=document.querySelector('#windowClose');
function closePreview(){
 clearInterval(timer);
 panel.hidden=true;
 document.querySelectorAll('[data-page]').forEach(b=>b.removeAttribute('aria-current'));
 document.querySelector('[data-page="pick"]').focus();
}
windowClose.onclick=closePreview;
function view(next,animate=false,focus=''){
clearInterval(timer);page=next;panel.hidden=false;screen.className=page+'-screen';
document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-current',b.dataset.page===page));
step.textContent='正在应用';step.hidden=page!=='load';windowClose.hidden=page==='load';
if(page==='pick'){
 const total=choices.filter(c=>c>=0).length;
 const allCurrent=choices.every(c=>c===cat);
 screen.innerHTML='<h1 class="visually-hidden" tabindex="-1">搭配鼠标皮肤</h1><div class="cats" aria-label="选择小猫">'+cats.map((n,c)=>'<button class="cat" id="cat'+c+'" aria-pressed="'+(c===cat)+'">'+art(0,c)+n+'</button>').join('')+'</div><div class="assignment-bar"><p class="assignment-hint">选小猫，点指针搭配</p><button class="whole-cat" id="applyAll" type="button" '+(allCurrent?'disabled':'')+'>'+(allCurrent?'已全部使用 ✓':'全部用'+cats[cat])+'</button></div><span class="visually-hidden" role="status" aria-live="polite">'+assignmentNotice+'</span><div class="grid">'+names.map((n,i)=>'<button class="row" id="row'+i+'" aria-pressed="'+(choices[i]===cat)+'">'+art(i,choices[i]<0?cat:choices[i],selected,48)+'<strong>'+n+'</strong><span class="tag '+(choices[i]>=0?'on':'')+'">'+(cats[choices[i]]??'保留原指针')+'</span></button>').join('')+'</div><footer class="pick-footer"><div class="size-setting"><span class="size-caption" id="sizeCaption">指针大小</span><div class="size-segments" role="group" aria-labelledby="sizeCaption">'+[25,35,45].map((n,i)=>'<button type="button" id="s'+n+'" aria-pressed="'+(n===selected)+'">'+['小','中','大'][i]+'</button>').join('')+'</div></div><button class="cta push" id="apply" '+(total?'':'disabled')+'>应用指针</button></footer>';
 cats.forEach((_,i)=>document.querySelector('#cat'+i).onclick=()=>{cat=i;assignmentNotice='';view('pick',false,'cat'+i)});
 document.querySelector('#applyAll').onclick=()=>{choices=Array(names.length).fill(cat);assignmentNotice='已将8种指针设为'+cats[cat]+'，还可以逐项调整。';view('pick',false,'cat'+cat)};
 names.forEach((_,i)=>document.querySelector('#row'+i).onclick=()=>{choices[i]=choices[i]===cat?-1:cat;assignmentNotice='';view('pick',false,'row'+i)});
 [25,35,45].forEach(n=>document.querySelector('#s'+n).onclick=()=>{selected=n;view('pick',false,'s'+n)});
 document.querySelector('#apply').onclick=()=>{appliedChoices=[...choices];applied=selected;hasApplied=true;view('load',true)};
}else if(page==='load'){
 screen.innerHTML='<h1 tabindex="-1">小猫正在赶来</h1><div class="stage"><div class="track" id="track" role="progressbar" aria-label="安装进度" aria-valuemin="0" aria-valuemax="100"><div class="fill"></div><img class="runner" src="../素材/银白猫-向右奔跑.png" alt=""></div><div class="progressText"><span id="phase"></span><strong id="pct"></strong></div></div>';
 const update=n=>{const track=document.querySelector('#track');track.style.setProperty('--progress',n+'%');track.setAttribute('aria-valuenow',n);document.querySelector('#pct').textContent=n+'%';document.querySelector('#phase').textContent=n<30?'检查指针':n<60?'备份原鼠标':n<100?'应用猫咪指针':'应用完成'};
 let n=animate?0:56;update(n);
 if(animate)timer=setInterval(()=>{n+=4;update(n);if(n===100){clearInterval(timer);timer=setTimeout(()=>view('done',false,'heading'),240)}},80);
 if(animate)focus='heading';
}else{
 const shownChoices=hasApplied?appliedChoices:choices, shownSize=hasApplied?applied:selected;
 const items=names.map((n,i)=>[n,i]).filter(([n,i])=>shownChoices[i]>=0);
 screen.innerHTML='<h1 tabindex="-1">小猫已就位</h1><p class="done-intro">移动鼠标，试试小猫。</p><div class="grid trial-grid">'+(items.length?items.map(([n,i])=>'<div class="row trial">'+art(i,shownChoices[i],shownSize,48)+'<div><strong>'+n+'</strong>'+(i===1?'<input aria-label="试用文字输入" placeholder="输入几个字">':i===2?'<small><button id="link">点一下链接</button></small>':'<small>'+descriptions[i]+'</small>')+'</div></div>').join(''):'<p>还没有分配指针。</p>')+'</div><footer><button id="back" class="plain">← 返回调整</button><button id="close" class="cta push">完成</button></footer>';
 document.querySelector('#back').onclick=()=>{choices=[...shownChoices];selected=shownSize;view('pick',false,'cat'+cat)};
 const link=document.querySelector('#link');if(link)link.onclick=()=>{link.textContent='点击成功'};
 document.querySelector('#close').onclick=closePreview;
}
if(focus==='heading')screen.querySelector('h1').focus();else if(focus)document.getElementById(focus)?.focus();
}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>view(b.dataset.page,b.dataset.page==='load'));
view('pick');
</script>
</html>
